<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3142"/>
      <stop offset="1" stop-color="#151922"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#efe5cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px body centered in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="rotate(-4 512 540)">
    <rect x="232" y="214" width="560" height="640" rx="28" fill="url(#paper)"/>
    <g stroke="#d8ccb0" stroke-width="10" stroke-linecap="round">
      <line x1="312" y1="640" x2="712" y2="640"/>
      <line x1="312" y1="706" x2="640" y2="706"/>
      <line x1="312" y1="772" x2="684" y2="772"/>
    </g>
    <text x="512" y="520" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="250" fill="#26231f" letter-spacing="-6"><tspan fill="#d6453d">.</tspan>md</text>
  </g>
</svg>
